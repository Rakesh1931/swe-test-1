version: '3.9'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ecocode
      POSTGRES_USER: ecocode
      POSTGRES_PASSWORD: ecocode
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]

  backend:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ecocode
      SPRING_DATASOURCE_USERNAME: ecocode
      SPRING_DATASOURCE_PASSWORD: ecocode
    depends_on: [db]
    volumes: [/var/run/docker.sock:/var/run/docker.sock]

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    environment:
      VITE_API_URL: http://localhost:8080/api
    depends_on: [backend]

volumes:
  pg_data:
