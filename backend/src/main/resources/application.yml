spring:
  application:
    name: ecocode-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecocode}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:ecocode}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:ecocode}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      fail-on-empty-beans: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

ecocode:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000
  sandbox:
    tmp-dir: /tmp/ecocode-sandbox
