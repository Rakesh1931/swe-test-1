spring:
  application:
    name: ecocode-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecocode}
    username: ${SPRING_DATASOURCE_USERNAME:ecocode}
    password: ${SPRING_DATASOURCE_PASSWORD:ecocode}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /

ecocode:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000
  sandbox:
    tmp-dir: /tmp/ecocode-sandbox
