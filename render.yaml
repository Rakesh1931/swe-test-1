databases:
  - name: ecocode-db
    databaseName: ecocode
    user: ecocode
    plan: free
    region: oregon

services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: ecocode-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: ecocode-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ecocode-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ecocode-db
          property: password
      - key: PORT
        value: 8080

  # 2. React + Vite Frontend Static Site
  - type: web
    name: ecocode-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ecocode-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
